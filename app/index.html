<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Grid — GTA 6 Cover Art Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Editor controls">
    <h1>VICE GRID</h1>
    <p class="tag">Turn your photo into GTA-style cover art. Offline, in your browser, no upload.</p>

    <div class="group">
      <h2>Photo</h2>
      <label class="file">Choose photos (up to 3)
        <input id="photo" type="file" accept="image/*" multiple>
      </label>
      <div class="row">
        <button id="samplePier" type="button">Sample: Pier</button>
        <button id="sampleBoulevard" type="button">Sample: Boulevard</button>
      </div>
      <div class="row seg" role="group" aria-label="Photo mode">
        <button type="button" data-mode="spread" class="active">One photo, spread</button>
        <button type="button" data-mode="per-panel">One per panel</button>
      </div>
    </div>

    <div class="group">
      <h2>Layout</h2>
      <div class="row wrap" role="group" aria-label="Layout">
        <button type="button" data-layout="cover-story" class="active">Cover Story</button>
        <button type="button" data-layout="triptych">Triptych</button>
        <button type="button" data-layout="six-pack">Six Pack</button>
        <button type="button" data-layout="hero-strip">Hero Strip</button>
      </div>
      <div id="panels" class="row wrap" aria-label="Select a panel"></div>
      <label>Zoom panel <span id="zoomVal">100%</span>
        <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1">
      </label>
      <label>Pan X <span id="panxVal">0.00</span>
        <input id="panx" type="range" min="-0.5" max="0.5" step="0.01" value="0">
      </label>
      <label>Pan Y <span id="panyVal">0.00</span>
        <input id="pany" type="range" min="-0.5" max="0.5" step="0.01" value="0">
      </label>
      <label id="panelPhotoRow" style="display:none">Photo for this panel
        <select id="panelPhoto"></select>
      </label>
    </div>

    <div class="group">
      <h2>Grade</h2>
      <div class="row wrap" role="group" aria-label="Colour grade">
        <button type="button" data-grade="sunset" class="active">Sunset</button>
        <button type="button" data-grade="neon">Neon</button>
        <button type="button" data-grade="noir">Noir</button>
        <button type="button" data-grade="palm">Palm</button>
      </div>
      <label>Grade strength <span id="gradeStrengthVal">70%</span>
        <input id="gradeStrength" type="range" min="0" max="1" step="0.05" value="0.7">
      </label>
    </div>

    <div class="group">
      <h2>Caption</h2>
      <label>Caption <input id="caption" type="text" maxlength="32" value="VICE GRID"></label>
      <label>Sub-caption <input id="subcaption" type="text" maxlength="40" value="LEONIDA • 2026"></label>
      <label>Caption size <span id="captionSizeVal">100%</span>
        <input id="captionSize" type="range" min="0.6" max="1.5" step="0.05" value="1">
      </label>
      <label>Caption position
        <select id="captionPos">
          <option value="bottom" selected>Bottom</option>
          <option value="top">Top</option>
        </select>
      </label>
      <div class="row" role="group" aria-label="Caption colour">
        <button type="button" data-color="#ffffff" class="swatch active" style="background:#ffffff" aria-label="White"></button>
        <button type="button" data-color="#ffe14d" class="swatch" style="background:#ffe14d" aria-label="Yellow"></button>
        <button type="button" data-color="#ff5ea8" class="swatch" style="background:#ff5ea8" aria-label="Pink"></button>
        <button type="button" data-color="#17121f" class="swatch" style="background:#17121f" aria-label="Black"></button>
      </div>
    </div>

    <div class="group">
      <h2>Finish</h2>
      <label>Vignette <span id="vignetteVal">45%</span>
        <input id="vignette" type="range" min="0" max="1" step="0.05" value="0.45">
      </label>
      <label class="check"><input id="grain" type="checkbox" checked> Film grain</label>
      <div class="row wrap" role="group" aria-label="Export size">
        <button type="button" data-size="1080x1080" class="active">1080 x 1080</button>
        <button type="button" data-size="1080x1350">1080 x 1350</button>
        <button type="button" data-size="1920x1080">1920 x 1080</button>
      </div>
      <button id="export" type="button" class="primary">Export PNG</button>
      <p id="status" role="status"></p>
    </div>
  </section>
  <section class="stage" aria-label="Preview">
    <canvas id="preview" width="540" height="540" aria-label="Cover preview"></canvas>
    <p class="hint">Click a panel in the preview to select it, then zoom and pan it.</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
